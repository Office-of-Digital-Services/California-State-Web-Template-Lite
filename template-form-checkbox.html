
<!-- This meta tag is for responsive design and ensures the page scales correctly on different devices. 
 Omit it if your site has a different method for handling responsive design. -->
<meta name="viewport" content="width=device-width, initial-scale=1" />

<!-- 
  Form checkboxes component
  
  Structure:
  - Uses <fieldset> with <legend> for semantic grouping (accessible to screen readers)
  - Each checkbox is wrapped in a div with class template-form-checkbox
  - Checkbox and label are associated via id/for attributes
  
  Attributes:
  - value: Unique identifier for each checkbox option (required for form submission)
  - data-border-dark="true": Changes the checkbox border color to darker gray (--gray-700) instead of default
-->
<fieldset class="template-form-fieldset">
  <legend>Pick one or more of these items:</legend>
  <div class="template-form-checkbox">
    <input type="checkbox" value="option1" id="CheckOption1" data-border-dark="true" />
    <label class="template-form-checkbox-label" for="CheckOption1">Option 1</label>
  </div>
  <div class="template-form-checkbox">
    <input type="checkbox" value="option2" id="CheckOption2" data-border-dark="true" />
    <label class="template-form-checkbox-label" for="CheckOption2">Option 2</label>
  </div>
  <div class="template-form-checkbox">
    <input type="checkbox" value="option3" id="CheckOption3" data-border-dark="true" />
    <label class="template-form-checkbox-label" for="CheckOption3">Option 3</label>
  </div>
</fieldset>

<style>
    *,
*::before,
*::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

fieldset.template-form-fieldset {
  border: none;
  padding: 0;
  margin: 0;

  > legend {
    box-sizing: border-box;
    font-family: var(
      --font-family-sans-serif,
      "Public Sans",
      system-ui,
      -apple-system,
      "Segoe UI",
      Roboto,
      "Helvetica Neue",
      "Noto Sans",
      sans-serif
    );
    font-size: var(--font-size-h4, calc(1rem * 1.4375));
    margin-top: 2rem;
    margin-bottom: 1rem;
    font-weight: var(--font-weight-7, 700);
    line-height: var(--font-lineheight-4, 1.625);

    @media (width >= 576px) {
      font-size: calc(
        var(--font-size-h4, calc(1rem * 1.4375)) + var(--ratio-headers, 0.1vw)
      );
      margin-top: calc(2rem + var(--ratio-headers, 0.1vw));
      margin-bottom: calc(1rem + var(--ratio-headers, 0.1vw));
    }
  }
}

div.template-form-checkbox {
  display: block;
  min-height: 1.5rem;
  padding-left: 1.5em;
  margin-bottom: 1rem;
  position: relative;
  cursor: pointer;

  & input[type="checkbox"] {
    font-size: calc(1rem * 1.125);
    border-radius: 0.25em;
    float: left;
    margin-left: -1.5em;
    width: 1em;
    height: 1em;
    margin-top: 0.25em;
    vertical-align: top;
    border: 1px solid var(--gray-300, #d2d2d6);
    background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3e%3cpath fill='none' stroke='%23fff' stroke-linecap='round' stroke-linejoin='round' stroke-width='3' d='m6 10 3 3 6-6'/%3e%3c/svg%3e");
    background-position: center;
    background-repeat: no-repeat;
    background-size: contain;
    appearance: none;
    cursor: pointer;

    &:focus {
      outline: 2px solid var(--outline-default-color, #0b8ee5);
      box-shadow: none;
      outline-offset: 2px;
    }

    &[data-border-dark="true"] {
      border-color: var(--gray-700, #5e5e6a);
    }
  }

  & input[type="checkbox"]:checked {
    background-color: var(--link-color, var(--color-p2, #046b99));
    border-color: var(--link-color, var(--color-p2, #046b99));
  }

  & label {
    box-sizing: border-box;
    margin-bottom: 0.5rem;
    font-family: var(
      --font-family-sans-serif,
      "Public Sans",
      system-ui,
      -apple-system,
      "Segoe UI",
      Roboto,
      "Helvetica Neue",
      "Noto Sans",
      sans-serif
    );
    font-weight: 600;
    font-size: calc(1rem * 1.125);
    line-height: 1.5;
    color: var(--text-color, #3b3a48);
    position: relative;
    display: inline-block;
    cursor: pointer;
  }
}

</style>
