data-bg options: "understated", "primary", "primary-gradient", "standout"
-->

<catempl-banner>

        Heading

        <p>

          informative, providing context for the user about the content or

        </p>

        <!-- Actions Container -->
        <div>
          <!-- data-action options: "secondary" (default is primary action) -->
          <a href="#">Primary Action</a>
          <a href="#" data-action="secondary">Secondary Action</a>
        </div>
      </div>
    </div>
  </section>
</catempl-banner>
