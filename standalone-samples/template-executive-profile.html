
<!-- This meta tag is for responsive design and ensures the page scales correctly on different devices. 
 Omit it if your site has a different method for handling responsive design. -->
<meta name="viewport" content="width=device-width, initial-scale=1" />

<catmplt-executive-profile>
  <!-- 
  Executive Profile Component 
  data-variant options: "transparent", "dark"

  Variants:
    - Default:     no modifier attribute (light background)
    - Transparent: add data-variant="transparent"
    - Dark:        add data-variant="dark"
-->
  <figure>
    <!-- START > img (Profile Photo) -->
    <img
      src="https://template.webstandards.ca.gov/images/blockquote-with-image.jpg"
      alt="Portrait of Name, Official Title" />
    <!-- END > img (Profile Photo) -->

    <!-- START > div[data-role="executive-profile-body"] (Profile Details) -->
    <div data-role="executive-profile-body">
      <!-- Official title -->
      <p>Official Title</p>
      <!-- Name -->
      <h3 data-role="executive-name">Name</h3>
      <!-- Agency -->
      <p>Government agency</p>
      <!-- Bio / Contact link -->
      <p>
        <a href="javascript:;" aria-label="Link to Official's Website">
          Bio or contact info
        </a>
      </p>
    </div>
    <!-- END > div[data-role="executive-profile-body"] (Profile Details) -->
  </figure>
  <!-- END > figure.template-executive-profile (Default) -->

  <!-- START > figure.template-executive-profile[data-variant="transparent"] (Transparent variant) -->
  <figure data-variant="transparent">
    <!-- START > img (Profile Photo) -->
    <img
      src="https://template.webstandards.ca.gov/images/blockquote-with-image.jpg"
      alt="Portrait of Name, Official Title" />
    <!-- END > img (Profile Photo) -->

    <!-- START > div[data-role="executive-profile-body"] (Profile Details) -->
    <div data-role="executive-profile-body">
      <p>Official Title</p>
      <h3 data-role="executive-name">Name</h3>
      <p>Government agency</p>
      <p>
        <a href="javascript:;" aria-label="Link to Official's Website">
          Bio or contact info
        </a>
      </p>
    </div>
    <!-- END > div[data-role="executive-profile-body"] (Profile Details) -->
  </figure>
  <!-- END > figure.template-executive-profile[data-variant="transparent"] (Transparent variant) -->

  <!-- START > figure.template-executive-profile[data-variant="dark"] (Dark variant) -->
  <figure data-variant="dark">
    <!-- START > img (Profile Photo) -->
    <img
      src="https://template.webstandards.ca.gov/images/blockquote-with-image.jpg"
      alt="Portrait of Name, Official Title" />
    <!-- END > img (Profile Photo) -->

    <!-- START > div[data-role="executive-profile-body"] (Profile Details) -->

  </figure>
  <!-- END > figure.template-executive-profile[data-variant="dark"] (Dark variant) -->
</catmplt-executive-profile>


<style>
  catmplt-executive-profile {
  *,
  *::before,
  *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  /* ----------------------------------------
   Executive Profile Component
   Variants:
     Default:     figure
     Transparent: figure[data-variant="transparent"]
     Dark:        figure[data-variant="dark"]
---------------------------------------- */

  & figure {
    display: flex;
    flex-direction: row;
    align-items: center;
    padding: 1rem;
    margin: 0 0 1rem;
    font-family: var(
      --font-family-sans-serif,
      "Public Sans",
      system-ui,
      -apple-system,
      "Segoe UI",
      "Roboto",
      "Helvetica Neue",
      "Noto Sans",
      sans-serif
    );
    font-size: var(--font-size-base, 1rem);
    border: none;
    background-color: var(--color-p2-pale, #eef8fb);

    /* START > img (Profile Photo) */
    > img {
      max-width: 100px;
      max-height: 100px;
      border-radius: 50%;
      margin-right: 1rem;
      position: relative;
      flex-shrink: 0;
    }

    /* START > div[data-role="executive-profile-body"] (Profile Details) */
    > [data-role="executive-profile-body"] {
      padding-left: 1rem;
      border-left: 1px solid var(--text-muted, var(--gray-700, #5e5e6a));

      /* Title / Agency paragraphs */
      > p,
      > [data-role="executive-name"] {
        margin-top: 4px;
        margin-bottom: 4px;
      }

      /* Name heading */
      > [data-role="executive-name"] {
        font-size: var(--font-size-large, 1.4375rem);
      }

      /* Bio / contact link */
      > p > a {
        color: var(--link-color, var(--color-p2, #046b99));

        &:hover,
        &:focus {
          color: var(--link-color-hover, var(--color-p2-darker, #035376));
        }

        &:focus {
          outline: 2px solid var(--outline-default-color, #0b8ee5);
          outline-offset: 2px;
        }
      }
    }

    /* Transparent variant: removes background color */
    &[data-variant="transparent"] {
      background-color: transparent;
    }

    /* Dark variant: white text and border on dark backgrounds */
    &[data-variant="dark"] {
      background-color: var(--color-p3, #323a45);

      > [data-role="executive-profile-body"] {
        border-left-color: var(--white, #fff);

        > p,
        > [data-role="executive-name"] {
          color: var(--white, #fff);
        }

        > p > a {
          color: var(--white, #fff);

          &:hover,
          &:focus {
            color: var(--color-p1, #fdb81e);
          }
        }
      }
    }
  }
}

</style>
