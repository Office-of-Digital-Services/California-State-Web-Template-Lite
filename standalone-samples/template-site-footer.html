<style>
  catmplt-site-footer {
  *,
  *::before,
  *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  > div {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: var(
      --font-family-sans-serif,
      "Public Sans",
      system-ui,
      -apple-system,
      "Segoe UI",
      Roboto,
      "Helvetica Neue",
      "Noto Sans",
      sans-serif
    );
    background-color: var(--color-p3, #323a45);
    color: var(--white, #fff);
    position: relative;
    line-height: 1.5;

    /* --- Regions --- */

    /* Content Container */
    > div {
      padding: 2rem 12px;
      margin: 0 auto;
      position: relative;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;

      @media (width >= 576px) {
        max-width: 540px;
      }

      @media (width >= 768px) {
        max-width: 720px;
      }

      @media (width >= 992px) {
        max-width: 960px;
        flex-direction: row;
        align-items: flex-start;
      }

      @media (width >= 1200px) {
        max-width: 1176px;
      }

      /* Footer Column */
      > div {
        margin-bottom: 1.5rem;

        @media (width >= 992px) {
          margin-bottom: 0;
          flex: 1;
        }

        /* Heading */
        > h2 {
          font-size: calc(
            var(--font-size-large, 1.4375rem) + var(--ratio, 0.1vw)
          );
          margin-top: 0;
          margin-bottom: 1rem;
          border-bottom: 1px solid;
          border-color: var(--color-p1, #fdb81e);
          padding-bottom: 1rem;
        }

        /* Links */
        > a {
          display: block;
          color: var(--white, #fff);
          font-size: calc(
            var(--font-size-regular, 1.125rem) + var(--ratio, 0.1vw)
          );
          text-decoration: none;
          margin-bottom: 1rem;
          margin-top: 1rem;

          &:hover,
          &:focus {
            text-decoration: underline;
            color: var(--color-p1, #fdb81e);
          }
        }
      }
    }

    /* --- Options --- */

    &[data-site-footer-bg="gray-100"] {
      background-color: var(--gray-100, #ededef);
      color: var(--gray-900, #3b3a48);

      > div > div > h2 {
        border-color: var(--color-p3, #323a45);
      }

      > div > div a {
        color: var(--gray-900, #3b3a48);

        &:hover,
        &:focus {
          color: var(--black, #000);
        }
      }
    }
  }
}
