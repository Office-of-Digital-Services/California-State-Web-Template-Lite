<style>
  catmplt-featured-search {
  *,
  *::before,
  *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  /* Featured Search Component */
  & form {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: var(
      --font-family-sans-serif,
      "Public Sans",
      system-ui,
      -apple-system,
      "Segoe UI",
      Roboto,
      "Helvetica Neue",
      "Noto Sans",
      sans-serif
    );
    color: var(--gray-900, #3b3a48);
    position: relative;
    line-height: 1.5;
    display: flex;

    /* Screen reader only content */
    & span[data-sr-only="true"] {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border-width: 0;
    }

    > input {
      width: 100%;
      padding: 0.75rem 0 0.75rem 0.75rem;
      font-size: 20px;
      border: 2px solid var(--color-p2, #046b99);
      border-right: 0;
      border-top-left-radius: 0.25rem;
      border-bottom-left-radius: 0.25rem;
      outline: none;
      outline-offset: 5px;
      transition:
        border-color 0.2s ease-in-out,
        box-shadow 0.2s ease-in-out;

      /* Hide the reset/clear button across all browsers */
      &::-webkit-search-cancel-button {
        display: none;
      }

      &:focus {
        outline: 2px solid var(--outline-default-color, #0b8ee5);
        box-shadow: none;
        outline-offset: -5px;
      }
    }

    > button {
      padding: 0 0.75rem;
      font-size: 30px;
      line-height: 1;
      border: 2px solid var(--color-p2, #046b99);
      border-left: 0;
      border-top-right-radius: 0.25rem;
      border-bottom-right-radius: 0.25rem;
      background-color: var(--white, #fff);
      color: var(--gray-900, #3b3a48);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      outline-offset: 5px;
      transition:
        background-color 0.2s ease-in-out,
        color 0.2s ease-in-out,
        box-shadow 0.2s ease-in-out;

      > svg {
        display: block;
        flex-shrink: 0;
      }

      &:hover {
        background-color: var(--gray-200, #d4d4d7);
        color: var(--gray-900, #3b3a48);
        box-shadow: none;
      }

      &:focus {
        outline: 2px solid var(--outline-default-color, #0b8ee5);
        outline-offset: -5px;
        box-shadow: none;
      }
    }
  }
}

</style>
